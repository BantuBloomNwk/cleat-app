<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cleat" />
    <meta name="theme-color" content="#0c0b0a" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons. The .ico is for browsers that still ask for one, the png set
         for everything since, and apple's is opaque because a transparent
         one gets composited onto black by some launchers and white by
         others. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Cleat, an agent you don't have to trust</title>
    <meta
      name="description"
      content="Autonomous speed governed by what you actually told it to do. You write one sentence about how your money should be handled, and an agent trades against it without ever seeing what you hold."
    />

    <!-- What a shared link looks like. The card is rendered from the same
         type and colours as the app, so a link and the thing it opens agree
         with each other. -->
    <meta property="og:site_name" content="Cleat" />
    <meta property="og:title" content="Cleat, an agent you don't have to trust" />
    <meta
      property="og:description"
      content="Autonomous speed governed by what you actually told it to do."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cleat-preview.netlify.app/" />
    <meta property="og:image" content="https://cleat-preview.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cleat. An agent you don't have to trust." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cleat, an agent you don't have to trust" />
    <meta
      name="twitter:description"
      content="Autonomous speed governed by what you actually told it to do."
    />
    <meta name="twitter:image" content="https://cleat-preview.netlify.app/og.png" />
    <meta name="twitter:image:alt" content="Cleat. An agent you don't have to trust." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
