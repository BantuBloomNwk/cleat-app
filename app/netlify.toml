# Preview hosting for the Cleat app. A separate project from anything else on
# this account, so a deploy here can never touch another site.
[build]
  command = "npm run build"
  publish = "dist"

# A single page app: every path has to fall through to index.html or a refresh
# on any tab returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────
# Headers.
#
# The policy is as tight as it is because of how the app is built rather
# than by effort: market data, chain reads and the issuer comparison all
# go through a function on this origin.
#
# connect-src is the one place that had to widen, and the reason is worth
# stating because it looks like a weakening and is the opposite. A client
# who brings their own model key must have the browser call that provider
# directly. Routing it through our proxy would mean their key and their
# prompts passing through our servers, which is exactly what bringing your
# own key is meant to avoid. So the three provider origins are listed, and
# a local model is allowed on loopback, where nothing leaves the machine
# at all.
#
# What that costs: script injection that already had execution could
# exfiltrate to one of four named hosts instead of none. What it buys: we
# never hold a client's provider credential. Given script-src is 'self'
# with no inline escape hatch, the first is a small delta on an attack
# that has already won, and the second is a property we cannot get any
# other way.
#
# The build emits no inline script and no inline style block, so
# script-src needs no escape hatch. style-src does need unsafe-inline,
# and that is worth being precise about rather than waving at: React
# writes style attributes for anything set with style={{ }}, and a style
# attribute is inline style. Removing it would mean a nonce per render,
# which CSP cannot express for attributes at all. The exposure from
# inline style is layout, not execution.
# ─────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      base-uri 'none';
      object-src 'none';
      frame-ancestors 'none';
      form-action 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob:;
      connect-src 'self'
        https://api.anthropic.com
        https://api.openai.com
        https://generativelanguage.googleapis.com
        http://localhost:11434
        http://127.0.0.1:11434;
      manifest-src 'self';
      worker-src 'self' blob:;
      media-src 'self' blob:;
      upgrade-insecure-requests
    """

    # Belt as well as braces. frame-ancestors above is the modern control
    # and this is the one older browsers actually obey.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

    # Send the origin to other sites and the full path only to ourselves,
    # so an outbound link cannot carry which mandate someone was reading.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Everything off except the three things this app genuinely does: a
    # passkey, a microphone for speaking a mandate, and the payment
    # handler is explicitly not one of them.
    Permissions-Policy = """
      accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(),
      camera=(), display-capture=(), document-domain=(), encrypted-media=(),
      fullscreen=(self), gamepad=(), geolocation=(), gyroscope=(),
      hid=(), idle-detection=(), local-fonts=(), magnetometer=(),
      microphone=(self), midi=(), payment=(), picture-in-picture=(),
      publickey-credentials-create=(self), publickey-credentials-get=(self),
      screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()
    """

    # Keep this origin out of other people's process and out of their
    # reach. The app embeds nothing cross origin, so neither costs us
    # anything.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Netlify announces itself on every response. There is no reason to
    # tell a scanner which stack to look up.
    X-Powered-By = ""

# The hashed assets never change under their own name, so they can be
# cached hard. index.html must not be, or a deploy takes an hour to reach
# anyone who has the old one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
