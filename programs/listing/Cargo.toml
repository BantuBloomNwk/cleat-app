[package]
name = "listing"
version = "0.1.0"
description = "A permissioned mint for locally listed equities, gated on an attestation from a licensed holder of the shares."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "listing"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
