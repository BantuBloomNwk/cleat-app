<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:600px;overflow:hidden;background:#0c0b0a}
  .bg{position:absolute;inset:0;background:url(../app/src/assets/wallpaper-dark.jpg) center/cover;opacity:.55}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0c0b0a 0%,rgba(12,11,10,.92) 38%,rgba(12,11,10,.55) 100%)}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;gap:56px;padding:0 84px}
  .emblem{width:260px;height:260px;flex:none;filter:drop-shadow(0 0 40px rgba(45,212,191,.28))}
  .emblem img{width:100%;height:100%;object-fit:contain}
  .word{font:700 30px/1 'Space Grotesk',sans-serif;letter-spacing:.32em;color:#e8e4dc;margin-bottom:26px}
  .word i{font-style:normal;color:#2dd4bf}
  .claim{font:italic 500 60px/1.08 'Fraunces',serif;color:#f5f1ea;margin:0 0 30px;max-width:680px}
  .tag{font:700 17px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#4fc4a7;text-transform:uppercase}
  .rail{margin-top:34px;display:flex;gap:12px}
  .chip{font:500 15px/1 'JetBrains Mono',monospace;color:#b9b2a6;border:1px solid rgba(232,228,220,.18);border-radius:999px;padding:10px 16px;background:rgba(20,19,17,.6)}
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="wrap">
    <div class="emblem"><img src="../app/src/assets/emblem-dark.png" alt=""></div>
    <div>
      <div class="word">CLEAT<i>.</i></div>
      <p class="claim">An agent you don’t have to trust.</p>
      <div class="tag">Markets drift. Cleat holds.</div>
      <div class="rail"><span class="chip">one sentence, on chain</span><span class="chip">checked blind</span><span class="chip">every refusal on record</span></div>
    </div>
  </div>
</body></html>
